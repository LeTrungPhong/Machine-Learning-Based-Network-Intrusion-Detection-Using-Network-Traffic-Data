# =============================================================================
# Network Intrusion Detection System - central configuration
# All relative paths are resolved against the project root (the folder that
# contains main.py). Every module reads its settings from this file.
# =============================================================================

project:
  name: "Machine Learning-Based Network Intrusion Detection Using Network Traffic Data"
  random_seed: 42

paths:
  datasets_dir: "datasets"
  processed_dir: "processed"        # extracted packets / flows / host features (Parquet)
  outputs_dir: "outputs"            # figures, tables, reports
  eda_dir: "outputs/eda"
  logs_dir: "outputs/logs"
  alerts_dir: "outputs/alerts"
  saved_models_dir: "saved_models"

storage:
  # Writes that would leave less than this much free space are refused.
  min_free_gb: 2.0
  # Below this a warning is logged before long-running jobs.
  warn_free_gb: 10.0

logging:
  level: "INFO"
  file: "nids.log"                  # created inside paths.logs_dir
  max_bytes: 10485760               # 10 MB per log file
  backup_count: 5

# -----------------------------------------------------------------------------
# Datasets
# -----------------------------------------------------------------------------
datasets:
  cicids2017:
    root: "datasets/CIC-IDS-2017"
    source: "HuggingFace mirror bencorn/CICIDS2017 (original: https://www.unb.ca/cic/datasets/ids-2017.html)"
    # Files ship with a .pcap extension but are pcapng (magic 0x0A0D0D0A).
    pcap_dir: "pcaps"
    csv_ml_dir: "csvs/MachineLearningCSV/MachineLearningCVE"        # 79 columns, no IP/port/timestamp
    csv_labelled_dir: "csvs/GeneratedLabelledFlows/TrafficLabelling" # 85 columns, includes Flow ID/IPs/Timestamp
    csv_encoding: "latin-1"         # Web Attack labels contain byte 0x96 (cp1252 en dash)
    # CSV 'Timestamp' is local capture time (d/m/Y H:M, minute resolution).
    # Observed: first packet of Friday pcap 11:59 UTC vs CSV 8:59 -> UTC-3 (ADT).
    csv_timezone: "America/Moncton"
    csv_timestamp_dayfirst: true
    label_column: "Label"
    benign_label: "BENIGN"
    # Raw labels are stripped and 0x96 is replaced by '-' before this optional
    # renaming map is applied (e.g. to merge rare classes in later phases).
    label_aliases: {}
    # Attack families (used for grouped analysis and to pool very rare classes).
    label_groups:
      BENIGN: "BENIGN"
      "DoS Hulk": "DoS"
      "DoS GoldenEye": "DoS"
      "DoS slowloris": "DoS"
      "DoS Slowhttptest": "DoS"
      DDoS: "DDoS"
      PortScan: "PortScan"
      "FTP-Patator": "BruteForce"
      "SSH-Patator": "BruteForce"
      "Web Attack - Brute Force": "WebAttack"
      "Web Attack - XSS": "WebAttack"
      "Web Attack - Sql Injection": "WebAttack"
      Bot: "Bot"
      Infiltration: "Infiltration"
      Heartbleed: "Heartbleed"
    clean_output: "processed/cic/cicids2017_clean.parquet"
    cleaning_report: "outputs/eda/cleaning_report.json"
    # Capture day of each file; used for time/capture-based splits.
    days:
      Monday: ["Monday-WorkingHours"]
      Tuesday: ["Tuesday-WorkingHours"]
      Wednesday: ["Wednesday-workingHours"]
      Thursday: ["Thursday-WorkingHours-Morning-WebAttacks", "Thursday-WorkingHours-Afternoon-Infilteration"]
      Friday: ["Friday-WorkingHours-Morning", "Friday-WorkingHours-Afternoon-PortScan", "Friday-WorkingHours-Afternoon-DDos"]
    # Expected files and byte sizes, measured on 2026-10-30 from the downloaded copy.
    expected_files:
      "pcaps/Monday-WorkingHours.pcap": 10822507416
      "pcaps/Tuesday-WorkingHours.pcap": 11048283608
      "pcaps/Wednesday-workingHours.pcap": 13420789612
      "pcaps/Thursday-WorkingHours.pcap": 8302500180
      "pcaps/Friday-WorkingHours.pcap": 8839309056
      "csvs/MachineLearningCSV/MachineLearningCVE/Monday-WorkingHours.pcap_ISCX.csv": 176927918
      "csvs/MachineLearningCSV/MachineLearningCVE/Tuesday-WorkingHours.pcap_ISCX.csv": 135078995
      "csvs/MachineLearningCSV/MachineLearningCVE/Wednesday-workingHours.pcap_ISCX.csv": 225166395
      "csvs/MachineLearningCSV/MachineLearningCVE/Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv": 52023263
      "csvs/MachineLearningCSV/MachineLearningCVE/Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv": 83102436
      "csvs/MachineLearningCSV/MachineLearningCVE/Friday-WorkingHours-Morning.pcap_ISCX.csv": 58316725
      "csvs/MachineLearningCSV/MachineLearningCVE/Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv": 76906168
      "csvs/MachineLearningCSV/MachineLearningCVE/Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv": 77123859
      "csvs/GeneratedLabelledFlows/TrafficLabelling/Monday-WorkingHours.pcap_ISCX.csv": 268649908
      "csvs/GeneratedLabelledFlows/TrafficLabelling/Tuesday-WorkingHours.pcap_ISCX.csv": 174696560
      "csvs/GeneratedLabelledFlows/TrafficLabelling/Wednesday-workingHours.pcap_ISCX.csv": 285642925
      "csvs/GeneratedLabelledFlows/TrafficLabelling/Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv": 92030223
      "csvs/GeneratedLabelledFlows/TrafficLabelling/Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv": 108723183
      "csvs/GeneratedLabelledFlows/TrafficLabelling/Friday-WorkingHours-Morning.pcap_ISCX.csv": 75386737
      "csvs/GeneratedLabelledFlows/TrafficLabelling/Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv": 101874777
