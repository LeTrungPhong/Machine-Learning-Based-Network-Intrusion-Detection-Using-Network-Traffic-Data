  ctu13:
    root: "datasets/CTU-13"
    source: "https://www.stratosphereips.org/datasets-ctu13"
    # Not downloaded yet. Expected layout: <root>/<scenario 1..13>/*.binetflow
    binetflow_glob: "*/*.binetflow"
    expected_files: {}

# -----------------------------------------------------------------------------
# Phase 1 - PCAP processing
# -----------------------------------------------------------------------------
pcap:
  reader: "scapy"                   # streaming PcapReader / PcapNgReader, never rdpcap on large files
  sample_max_packets: 200000        # cap used for quick tests on real captures
  chunk_rows: 500000                # rows per Parquet write
  # Packet-level CSV is ~10x larger than Parquet and halves throughput
  # (measured on 200k CIC Friday frames: 28.1 MB vs 2.8 MB); request it with
  # --formats parquet csv for samples. Flow-level outputs default to both.
  export_formats: ["parquet"]
  # Used only to estimate output size for the free-space guard.
  estimated_capture_bytes_per_packet: 600
  estimated_output_bytes_per_packet: 150

flow:
  # Semantics follow CICFlowMeter (used to build CIC-IDS-2017):
  #   flow_timeout_s     - maximum flow duration; a packet arriving later than this
  #                        after the flow start begins a new flow (CIC: 120 s)
  #   activity_timeout_s - gap that splits a flow into active/idle periods for the
  #                        Active*/Idle* statistics (CIC: 5 s)
  # idle_timeout_s closes flows with no packets for this long. Keeping it equal
  # to flow_timeout_s reproduces CIC behaviour; lower it to save memory live.
  flow_timeout_s: 120.0
  idle_timeout_s: 120.0
  activity_timeout_s: 5.0
  # After FIN in both directions or RST, packets of the same 5-tuple arriving
  # within this grace period (e.g. the final ACK) stay in the flow instead of
  # opening a new one (avoids the "TCP appendix" artefact in CIC-IDS-2017).
  tcp_close_grace_s: 1.0
  # Drop a packet identical to the previous one of the same flow (same direction,
  # lengths, flags, TTL) within this many microseconds. 0 = keep all packets,
  # as CICFlowMeter did. ~9% of packets in a Friday sample were such copies.
  dedup_window_us: 0
  # The capture sometimes timestamps a reply (SYN|ACK or RST|ACK) a few us
  # *before* the SYN that caused it (seen in the Friday PortScan). If a flow
  # holds only such a reply and the opposite side's SYN arrives within this
  # window, the SYN sender becomes the initiator instead of opening a 2nd flow.
  reorder_window_us: 1000
  sweep_interval_s: 1.0             # how often (capture time) timed-out flows are flushed
  max_active_flows: 500000          # oldest flows are evicted beyond this (flagged incomplete)
  export_formats: ["parquet", "csv"]
  chunk_rows: 200000

# -----------------------------------------------------------------------------
# Phase 2 - host-level features
# -----------------------------------------------------------------------------
host_features:
  window_s: 60.0
  step_s: 10.0
  portscan:
    min_unique_dst_ports: 50        # vertical scan
    min_unique_dst_ips: 20          # horizontal scan, only together with:
    min_failed_ratio: 0.5           # share of the host's TCP flows that failed in the window
  beaconing:
    min_connections: 6
    max_interval_cv: 0.2            # coefficient of variation of inter-connection intervals

# -----------------------------------------------------------------------------
# Phase 4 - preprocessing
# -----------------------------------------------------------------------------
preprocessing:
  # Split strategies (all computed by preprocessing/preprocess.py):
  #   temporal_per_class - per label, earliest flows -> train, later -> val, latest -> test.
  #                        Every class is present in every split; test is always "future".
  #   by_day             - train_days vs test_days; test contains attack types never seen
  #                        in training (used for anomaly / unseen-attack evaluation).
  #   stratified_random  - random stratified split; reported only as an optimistic baseline.
  splits:
    classification: "temporal_per_class"
    anomaly: "by_day"
  train_days: ["Monday", "Tuesday", "Wednesday"]
  test_days: ["Thursday", "Friday"]
  val_fraction: 0.15                # share of all rows (per class for temporal_per_class)
  test_fraction: 0.20
  scaler: "robust"                  # robust | standard
  log_transform: true               # sign(x) * log1p(|x|) before scaling (heavy-tailed features)
  correlation_threshold: 0.99       # drop one of each |Pearson r| > threshold pair (train only); null = off
  correlation_sample_rows: 300000
  top_k_ports: 32                   # most frequent training dst ports one-hot encoded, rest -> "infrequent"
  imbalance: "class_weight"         # none | class_weight | smote (training split only)
  smote_max_per_class: 50000
  float_dtype: "float32"
  splits_dir: "processed/splits"
  preprocessors_dir: "saved_models/preprocessing"
  eda_sample_rows: 300000

# -----------------------------------------------------------------------------
# Phase 5-8 - models (filled in during the corresponding steps)
# -----------------------------------------------------------------------------
models:
  gaussian: {}
  isolation_forest: {}
  autoencoder: {}
  vae: {}
  random_forest: {}
  xgboost: {}
  botnet_graph: {}

# -----------------------------------------------------------------------------
# Phase 9 - real-time detection
# -----------------------------------------------------------------------------
realtime:
  interface: "eth0"
  bpf_filter: "ip"
  # Flow settings (timeouts, grace, dedup) come from the `flow` section so the
  # live feature schema matches training; these only override memory limits.
  window_s: 60.0
  flush_interval_s: 5.0
  max_active_flows: 200000
  alert_log: "alerts.jsonl"         # created inside paths.alerts_dir
  anomaly_threshold: null           # loaded with the trained model when null
  block_ips: false                  # never block automatically
